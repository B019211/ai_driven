- name: Deploy PHP application
  hosts: execution
  gather_facts: false

  tasks:
    - name: Ensure application web root exists
      ansible.builtin.file:
        path: /home/vboxuser/containers/html
        state: directory
        owner: vboxuser
        group: vboxuser
        mode: "0755"

    - name: Deploy PHP application files
      ansible.builtin.copy:
        src: "../src/{{ item }}"
        dest: "/home/vboxuser/containers/html/{{ item }}"
        owner: vboxuser
        group: vboxuser
        mode: "0644"
      loop:
        - index.php
        - config.php
        - functions.php
        - db.php

    - name: Set SELinux context for application files
      ansible.builtin.command:
        cmd: "chcon -t container_file_t /home/vboxuser/containers/html/{{ item }}"
      loop:
        - index.php
        - config.php
        - functions.php
        - db.php
