---
- name: Deploy LAMP Podman stack
  hosts: execution_node
  become: yes
  vars:
    app_dir: "/home/vboxuser/containers/html"
    mysql_data_dir: "/home/vboxuser/containers/mysql_data"
    web_container_port: 8080
    mysql_root_password: "SUPER_SECRET_ROOT_PASSWORD" # 本番環境ではAnsible Vaultを使用してください
    mysql_database: "testdb"
    mysql_user: "appuser"
    mysql_password: "APP_USER_PASSWORD" # 本番環境ではAnsible Vaultを使用してください
  tasks:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: vboxuser
        group: vboxuser
        mode: '0755'

    - name: Ensure MySQL data directory exists for persistence
      ansible.builtin.file:
        path: "{{ mysql_data_dir }}"
        state: directory
        owner: vboxuser
        group: vboxuser
        mode: '0755'

    - name: Copy PHP application files
      ansible.builtin.template:
        src: templates/index.php.j2
        dest: "{{ app_dir }}/index.php"
        owner: vboxuser
        group: vboxuser
        mode: '0644'

    - name: Copy MySQL initialization script
      ansible.builtin.copy:
        src: files/init.sql
        dest: "{{ app_dir }}/init.sql" # Docker entrypoint initdb.d にマウントするために一時的に配置
        owner: vboxuser
        group: vboxuser
        mode: '0644'

    - name: Stop and remove existing lamp-pod if it exists
      community.general.podman_pod:
        name: lamp-pod
        state: absent
      ignore_errors: yes # Podが存在しない場合のエラーを無視

    - name: Create Podman pod 'lamp-pod'
      community.general.podman_pod:
        name: lamp-pod
        state: present
        publish_ports:
          - "{{ web_container_port }}:80" # ホストポート:コンテナポートでPodを公開

    - name: Run mysql container in lamp-pod
      community.general.podman_container:
        name: mysql
        image: mysql:8.0
        state: started
        pod: lamp-pod
        env:
          MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
          MYSQL_DATABASE: "{{ mysql_database }}"
          MYSQL_USER: "{{ mysql_user }}"
          MYSQL_PASSWORD: "{{ mysql_password }}"
        volumes:
          - "{{ mysql_data_dir }}:/var/lib/mysql" # データの永続化
          - "{{ app_dir }}/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" # 初期化スクリプトを実行

    - name: Run web container in lamp-pod
      community.general.podman_container:
        name: web
        image: php:8.2-apache
        state: started
        pod: lamp-pod
        volumes:
          - "{{ app_dir }}:/var/www/html:Z" # ドキュメントルートをバインドマウント、:ZはSELinuxコンテキスト用
        env:
          DB_HOST: "mysql" # Pod内のサービス名
          DB_NAME: "{{ mysql_database }}"
          DB_USER: "{{ mysql_user }}"
          DB_PASS: "{{ mysql_password }}"

    - name: Remove temporary MySQL initialization script
      ansible.builtin.file:
        path: "{{ app_dir }}/init.sql"
        state: absent

    - name: Verify application is running
      ansible.builtin.uri:
        url: "http://rockey8:{{ web_container_port }}"
        status_code: 200
        timeout: 60 # MySQLの起動を考慮しタイムアウトを長く設定
