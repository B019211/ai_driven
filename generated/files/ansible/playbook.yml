- name: Ensure pod exists
  hosts: execution
  tasks:
  - name: Ensure pod exists
    containers.podman.podman_pod:
      name: lamp-pod
      publish:
      - 8080:80
      state: started
- name: Create PHP container
  hosts: execution
  tasks:
  - name: Create PHP container
    containers.podman.podman_container:
      name: php
      image: php:8.2-apache
      pod: lamp-pod
      env:
        DOCUMENT_ROOT: /var/www/html
      state: started
- name: Create MySQL container
  hosts: execution
  tasks:
  - name: Create MySQL container
    containers.podman.podman_container:
      name: mysql
      image: mysql:8.0
      pod: lamp-pod
      env:
        MYSQL_DATABASE: testdb
        MYSQL_ROOT_PASSWORD: securepassword
      state: started
- name: Copy index.php
  hosts: execution
  tasks:
  - name: Copy index.php
    copy:
      src: '{{ playbook_dir }}/../src/index.php'
      dest: /home/vboxuser/containers/html/index.php
