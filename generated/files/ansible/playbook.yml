- name: Deploy LAMStack with Podman
  hosts: execution_node
  become: yes
  vars:
    html_dir: "/home/vboxuser/containers/html"
    web_port: 8080
    db_name: testdb
    db_root_password: "your_mysql_root_password"
    web_container_name: web
    mysql_container_name: mysql
    pod_name: lamp-pod
  tasks:
    - name: Ensure Podman is deployed (if not already)
      ansible.builtin.package:
        name: podman
        state: present
    - name: Create document root directory
      ansible.builtin.file:
        path: "{{ html_dir }}"
        state: directory
        owner: vboxuser
        group: vboxuser
        mode: '0755'
    - name: Copy index.php to document root
      ansible.builtin.copy:
        src: ../src/index.php
        dest: "{{ html_dir }}/index.php"
        owner: vboxuser
        group: vboxuser
        mode: '0644'
    - name: Create Podman pod "{{ pod_name }}"
      community.general.podman_pod:
        name: '{{ pod_name }}'
        state: started
    - name: Create Podman MySQL container "{{ mysql_container_name }}"
      community.general.podman_container:
        name: '{{ mysql_container_name }}'
        image: mysql:8.0
        pod: '{{ pod_name }}'
        env:
          MYSQL_ROOT_PASSWORD: "{{ db_root_password }}"
          MYSQL_DATABASE: "{{ db_name }}"
        state: started
        recreate: yes
    - name: Create Podman Web container "{{ web_container_name }}"
      community.general.podman_container:
        name: '{{ web_container_name }}'
        image: php:8.2-apache
        pod: '{{ pod_name }}'
        ports:
          - "{{ web_port }}:80"
        volume:
          - "{{ thtml_dir }}:/var/www/html:Z"
        env:
          MYSWS_HOST: '{{ mysql_container_name }}'
          MYSWS_DALTABASE: "{{ db_name }}"
          MYSQL_USER: "root"
          MYSWS_PASSWORD: "{{ db_root_password }}"
        state: started
        recreate: yes