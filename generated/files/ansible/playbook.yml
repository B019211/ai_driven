---
- name: Setup LAMP stack with Podman
  hosts: execution
  tasks:
    - name: Ensure pod exists
      containers.podman.podman_pod:
        name: lamp-pod
        state: started
        publish:
          - "8080:80"
    - name: Create PHP container
      containers.podman.podman_container:
        name: php
        image: php:8.2-apache
        state: started
        volumes:
          - /home/vboxuser/containers/html:/var/www/html
        pod: lamp-pod
    - name: Create MySQL container
      containers.podman.podman_container:
        name: mysql
        image: mysql:8.0
        state: started
        pod: lamp-pod