- name: Deploy LAMP Infrastructure
  hosts:
  - execution
  tasks:
  - name: Create lamp-pod with port mapping
    containers.podman.podman_pod:
      name: lamp-pod
      state: started
      publish:
      - 8080:80
  - name: Start PHP container in pod
    containers.podman.podman_container:
      image: php:8.2-apache
      name: php
      pod: lamp-pod
      state: started
      command:
      - sh
      - -c
      - docker-php-ext-install pdo_mysql && apache2-foreground
      env:
        db_host: mysql
        db_port: 3306
        db_name: testdb
        db_user: root
        db_password: secret
      volumes:
      - /home/vboxuser/containers/html:/var/www/html
  - name: Copy index.php to web container
    copy:
      src: ../src/index.php
      dest: /home/vboxuser/containers/html/index.php
