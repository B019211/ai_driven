---
- name: Deploy LAMP Stack on Podman
  hosts: rockey8
  tasks:
    - name: Create document root directory
      ansible.builtin.file:
        path: /home/vboxuser/containers/html
        state: directory
        mode: '0755'

    - name: Create lamp-pod
      containers.podman.podman_pod:
        name: lamp-pod
        state: started
        ports:
          - "8080:80"

    - name: Run MySQL container
      containers.podman.podman_container:
        name: mysql
        image: docker.io/library/mysql:8.0
        pod: lamp-pod
        state: started
        env:
          MYSQL_DATABASE: testdb
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"

    - name: Run Web container
      containers.podman.podman_container:
        name: web
        image: docker.io/library/php:8.2-apache
        pod: lamp-pod
        state: started
        volume:
          - /home/vboxuser/containers/html:/var/www/html:Z