- name: Create LAMP environment
  hosts: execution
  tasks:
  - name: Create pod
    containers.podman.podman_pod:
      name: lamp-pod
      publish:
      - 8080:80
      state: started
  - name: Create PHP container
    containers.podman.podman_container:
      name: php
      image: php:8.2-apache
      pod: lamp-pod
      volumes:
      - /home/vboxuser/containers/html:/var/www/html:Z
      env:
        PHP_ENV: production
      state: started
  - name: Create MySQL container
    containers.podman.podman_container:
      name: mysql
      image: mysql:8.0
      pod: lamp-pod
      env:
        MYSQL_ROOT_PASSWORD: secret
        MYSQL_DATABASE: testdb
      state: started
  - name: Copy index.php
    copy:
      src: '{{ playbook_dir }}/../src/index.php'
      dest: /home/vboxuser/containers/html/index.php
      force: true
      owner: root
      group: root
