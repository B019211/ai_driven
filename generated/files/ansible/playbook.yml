---
- name: Deploy LAMP stack with Podman
  hosts: podman_hosts
  become: yes
  tasks:
    - name: Ensure Podman is installed
      ansible.builtin.package:
        name: podman
        state: present

    - name: Create document root directory
      ansible.builtin.file:
        path: /home/vboxuser/containers/html
        state: directory
        mode: '0755'
        owner: vboxuser
        group: vboxuser

    - name: Copy index.php to document root
      ansible.builtin.copy:
        src: ../src/index.php
        dest: /home/vboxuser/containers/html/index.php
        mode: '0644'
        owner: vboxuser
        group: vboxuser

    - name: Ensure lamp-pod exists
      community.general.podman_pod:
        name: lamp-podm
        state: started

    - name: Ensure mysql container is running in lamp-pod
      community.general.podman_container:
        name: mysql
        image: mysql:8.0
        pod: lamp-podm
        state: started
        env:
          MYSQL_ROOT_PASSWORD: "password"
          MYSQL_DATABASE: "testdb"
        restart_policy: always
        networks:
          - podman

    - name: Ensure web container is running in lamp-pod
      community.general.podman_container:
        name: web
        image: php:8.2-apache
        pod: lamp-podm
        state: started
        ports:
          - "8080:80"
        volume:
          - "/home/vboxuser/containers/html:/var/www/html:Z"
        restart_policy: always
        dependencies:
          - mysql
        networks:
          - podman