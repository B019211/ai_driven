---
- name: Setup PHP environment with PDO and Podman
  hosts: localhost
  tasks:
    - name: Update package list
      apt:
        update_cache: yes
      become: yes

    - name: Install required packages
      apt:
        name:
          - apache2
          - php
          - php-pdo
          - php-mysql
          - podman
        state: present
      become: yes

    - name: Enable Apache mod_rewrite
      apache2_module:
        name: rewrite
        state: present
      become: yes

    - name: Restart Apache service
      service:
        name: apache2
        state: restarted
      become: yes

    - name: Run Podman container
      podman:
        image: php:8.2-apache
        name: php-app
        state: running
        ports:
          - "80:80"
      become: yes

    - name: Check container status
      command: podman ps -a
      register: container_status
      become: yes

    - name: Fail if container not running
      assert:
        that:
          - container_status.stdout | regex_search('php-app')
        fail_msg: "Container failed to start"
        success_msg: "Container started successfully"
      become: yes