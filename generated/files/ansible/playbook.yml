---
- name: Deploy LAMP stack with Podman
  hosts: all
  tasks:
    - name: Create podman pod
      shell: podman pod create --name lamp-pod
      register: pod_result

    - name: Run MySQL container
      shell: podman run -d --name mysql --pod lamp-pod -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=testdb mysql:8.0
      register: mysql_result

    - name: Run PHP container
      shell: podman run -d --name php --pod lamp-pod -p 8080:80 -v /home/vboxuser/containers/html:/home/vboxuser/containers/html php:8.2-apache
      register: php_result