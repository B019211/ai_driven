---
- name: Ensure Podman is installed (optional, assuming pre-installed)
  ansible.builtin.package:
    name: podman
    state: present

- name: Ensure MySQL data directory exists
  ansible.builtin.file:
    path: "{{ mysql_data_path }}"
    state: directory
    owner: vboxuser
    group: vboxuser
    mode: '0755'

- name: Ensure lamp-pod is present
  community.general.podman_pod:
    name: "{{ pod_name }}"
    state: present

- name: Create mysql container in lamp-pod
  community.general.podman_container:
    name: "{{ mysql_container_name }}"
    image: "{{ mysql_image }}"
    pod: "{{ pod_name }}"
    state: started
    recreate: yes
    env:
      MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
      MYSQL_DATABASE: "{{ mysql_db_name }}"
      MYSQL_USER: "{{ mysql_user }}"
      MYSQL_PASSWORD: "{{ mysql_password }}"
    volume:
      - "{{ mysql_data_path }}:/var/lib/mysql:Z"

- name: Create web container in lamp-pod
  community.general.podman_container:
    name: "{{ web_container_name }}"
    image: "{{ web_image }}"
    pod: "{{ pod_name }}"
    state: started
    recreate: yes
    ports:
      - "{{ web_port_host }}:{{ web_port_container }}"
    volume:
      - "{{ app_document_root }}:{{ app_document_root_container }}:ro,Z"